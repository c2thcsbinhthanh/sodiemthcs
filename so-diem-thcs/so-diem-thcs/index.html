<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0E7C6B" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
<title>Sổ Điểm THCS</title>
<meta name="description" content="Ứng dụng quản lý điểm học sinh THCS: tự tính điểm theo Thông tư 22, theo dõi mục tiêu, dự đoán điểm, theo dõi nghỉ học và AI phân tích học tập." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" />

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/forms.css" />
<link rel="stylesheet" href="css/charts.css" />
<link rel="stylesheet" href="css/onboarding.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="app-loader" class="app-loader">
  <i class="fa-solid fa-graduation-cap"></i>
  <p>Đang tải Sổ Điểm THCS...</p>
</div>

<div id="onboarding-outlet" class="onboarding-outlet" hidden></div>

<div id="app-shell" class="app-shell" hidden>
  <aside class="nav-rail">
    <div class="nav-rail__brand">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>Sổ Điểm THCS</span>
    </div>
    <nav id="nav-desktop" class="nav-rail__list"></nav>
    <button id="theme-toggle-desktop" class="nav-rail__theme-toggle" type="button">
      <i class="fa-solid fa-circle-half-stroke"></i>
      <span>Đổi giao diện</span>
    </button>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <span class="topbar__brand"><i class="fa-solid fa-graduation-cap"></i> Sổ Điểm THCS</span>
      <button id="theme-toggle-mobile" class="icon-btn" type="button" aria-label="Đổi giao diện">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
    </header>

    <div id="global-sim-banner" class="global-sim-banner" hidden></div>

    <main id="view-outlet" class="view-outlet"></main>

    <nav id="nav-mobile" class="nav-bottom"></nav>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script async defer src="https://accounts.google.com/gsi/client"></script>

<script type="module" src="js/main.js"></script>
</body>
</html>
